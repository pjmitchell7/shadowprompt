name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadowprompt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Install Python verification dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check authored source constraints
        run: python scripts/check_source.py
      - name: Test Python engine and API
        run: python -m pytest -q
      - name: Test browser inspection engine
        run: npm test
      - name: Build Pages application
        run: npm run build
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Verify production browser behavior
        run: npm run test:browser
      - name: Upload tested Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested application
        id: deployment
        uses: actions/deploy-pages@v4
